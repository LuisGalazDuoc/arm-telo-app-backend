# =====================================================================
#  Armatelo - auth-service (login, registro, perfil y usuarios)
# =====================================================================

spring.application.name=auth-service
server.port=${PORT:9091}

# ---------- Base de datos MySQL (una base por microservicio) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/armatelo_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA: las tablas las crea Liquibase, no Hibernate ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Liquibase (tablas y datos iniciales) ----------
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- JWT ----------
# Misma clave en todos los microservicios. Mínimo 32 caracteres (HS256).
armatelo.jwt.secret=${JWT_SECRET:armatelo-clave-secreta-de-desarrollo-cambiar-en-produccion-2026}
armatelo.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

# ---------- Comunicación interna entre microservicios ----------
armatelo.interno.clave=${CLAVE_INTERNA:armatelo-clave-interna-dev}
