# =====================================================================
#  Armatelo - API Gateway
#  El frontend solo conoce esta URL: http://localhost:9090/api/v1/...
#  Cada ruta se reenvía al microservicio correspondiente.
# =====================================================================

spring.application.name=api-gateway
server.port=${PORT:9090}

# ---------- Rutas ----------
# auth-service: login, registro, perfil y gestión de usuarios
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_URL:http://localhost:9091}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**

# catalogo-service: productos y categorías
spring.cloud.gateway.server.webflux.routes[1].id=catalogo-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOGO_URL:http://localhost:9092}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/productos/**,/api/v1/categorias/**

# orden-service: checkout, pago, órdenes y reportes
spring.cloud.gateway.server.webflux.routes[2].id=orden-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDEN_URL:http://localhost:9093}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/ordenes/**,/api/v1/reportes/**

# contacto-service: mensajes del formulario de contacto
spring.cloud.gateway.server.webflux.routes[3].id=contacto-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CONTACTO_URL:http://localhost:9094}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/mensajes/**

# Las rutas /internal/** (comunicación entre microservicios) NO se publican en el gateway.

# ---------- CORS (frontend Vite) ----------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Content-Disposition
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
